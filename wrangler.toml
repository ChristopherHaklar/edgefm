name = "edgefm"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "edgefm-audio"

[vars]
# Public URL of the edgefm-audio bucket. Use a custom domain in production so segments are
# CDN-cached; the pub-XXXX.r2.dev URL is rate-limited and only meant for testing.
PUBLIC_URL = "https://audio.example.com"
