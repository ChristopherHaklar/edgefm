    <path d="M8 8 V56"/>
    <path d="M8 8 H50"/>
    <path d="M8 32 H30"/>
    <path d="M8 56 H40"/>
  </g>
  <circle cx="44" cy="32" r="6" fill="#ff6a2b"/>
  <text x="74" y="45" fill="#ff6a2b" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace"
        font-size="34" font-weight="700" letter-spacing="4">EDGE FM</text>
</svg>
