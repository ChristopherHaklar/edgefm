<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeFM</title>
  <!-- PNG first with sizes, so browsers that support SVG icons pick the SVG -->
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#141414">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
    }
    h1 img { display: block; width: min(380px, 88vw); height: auto; }
    #now-playing { font-size: 0.9rem; color: #aaa; min-height: 1.2em; }
    #controls { display: flex; align-items: center; gap: 0.75rem; }
    #mute { background: none; border: 0; color: inherit; font-size: 1.25rem; cursor: pointer; }
    #volume { width: 200px; accent-color: #eee; }
    #tune-in {
      background: #eee; color: #111; border: 0; border-radius: 999px;
      padding: 0.6rem 1.4rem; font: inherit; cursor: pointer;
    }
    #status { font-size: 0.75rem; color: #555; }
  </style>
</head>
<body>
  <h1><img src="logo.svg" alt="EdgeFM" width="584" height="205"></h1>
  <div id="now-playing">Loading...</div>
  <button id="tune-in" hidden>Click anywhere to tune in</button>
  <div id="controls">
    <button id="mute" aria-label="Mute">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>
  <audio id="player" autoplay></audio>
  <div id="status"></div>

  <script type="module">
    import { buildSchedule } from "./lib/schedule.js";
    import { createStation } from "./lib/playlist.js";

    // The R2 bucket's public URL (custom domain): station.json and the audio segments.
    // The player builds its own playlists from station.json, so web listeners never call the Worker
    const STATION_URL = "https://audio.edgefm.live";
    // Fallback for browsers that can't run hls.js (older iPhones) or if station.json can't be loaded
    const WORKER_URL = "https://stream.edgefm.live";
    const REFRESH_MS = 5 * 60 * 1000; // pick up a new publish in open tabs

    const audio = document.getElementById("player");
    const nowPlaying = document.getElementById("now-playing");
    const status = document.getElementById("status");
    const tuneInButton = document.getElementById("tune-in");
    const muteButton = document.getElementById("mute");
    const volumeSlider = document.getElementById("volume");

    let station = null, version = null, clockOffsetMs = 0, heardSegment = null;
    const now = () => Date.now() + clockOffsetMs;

    // Builds the same schedule the pipeline and Worker use, from the same code
    async function loadStation() {
      const res = await fetch(`${STATION_URL}/station.json`, { cache: "no-cache" });
      if (!res.ok) throw new Error(`station.json: HTTP ${res.status}`);
      const data = await res.json();
      if (data.version === version) return;
      station = createStation(buildSchedule(data.catalog, data.wheels, { onWarn() {} }), data.catalog);
      version = data.version;
    }

    // Everyone should hear the same thing, so correct a PC clock that's off using the
    // web server's clock (same origin, so its Date header is readable). Date only has
    // whole seconds, so small differences are left alone.
    async function syncClock() {
      try {
        const sent = Date.now();
        const res = await fetch(location.href, { method: "HEAD", cache: "no-store" });
        const server = Date.parse(res.headers.get("Date"));
        const offset = server + 500 - (sent + Date.now()) / 2;
        if (Number.isFinite(offset) && Math.abs(offset) > 2000) clockOffsetMs = offset;
      } catch {}
    }

    // Browsers only let a page start sound by itself once the listener has used the site
    // before. Until then the first click or key press anywhere tunes in
    function tuneIn() {
      audio.play().catch(() => { tuneInButton.hidden = false; });
    }
    audio.addEventListener("playing", () => { tuneInButton.hidden = true; });
    audio.addEventListener("pause", () => { tuneInButton.hidden = false; });
    for (const type of ["pointerdown", "keydown"]) {
      document.addEventListener(type, () => { if (audio.paused) tuneIn(); });
    }

    // A radio station has no pause, only volume
    function setMuted(muted) {
      audio.muted = muted;
      muteButton.textContent = muted ? "🔇" : "🔊";
      muteButton.setAttribute("aria-label", muted ? "Unmute" : "Mute");
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = muted ? "paused" : "playing";
    }
    muteButton.addEventListener("click", () => setMuted(!audio.muted));
    volumeSlider.addEventListener("input", () => {
      audio.volume = volumeSlider.valueAsNumber;
      setMuted(audio.volume === 0);
      try { localStorage.setItem("volume", audio.volume); } catch {}
    });
    try {
      const saved = localStorage.getItem("volume");
      if (saved !== null) audio.volume = volumeSlider.value = Math.min(1, Math.max(0, Number(saved) || 0));
    } catch {}
    // iPhones only allow volume changes with the hardware buttons
    const probe = audio.volume;
    audio.volume = probe === 1 ? 0.5 : 1;
    if (audio.volume === probe) volumeSlider.hidden = true;
    audio.volume = probe;

    // Media keys and headset buttons mute and unmute instead of pausing
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("pause", () => setMuted(true));
      navigator.mediaSession.setActionHandler("play", () => { setMuted(false); if (audio.paused) tuneIn(); });
    }

    // hls.js asks this loader for playlists instead of fetching a URL
    function stationLoader() {
      return class extends Hls.DefaultConfig.loader {
        load(context, config, callbacks) {
          const text = station.playlist(STATION_URL, now());
          const t = performance.now();
          const stats = this.stats ?? {};
          Object.assign(stats, { aborted: false, loaded: text.length, total: text.length, retry: 0, chunkCount: 0, bwEstimate: 0 });
          stats.loading = { start: t, first: t, end: t };
          stats.parsing ??= { start: 0, end: 0 };
          stats.buffering ??= { start: 0, first: 0, end: 0 };
          this.stats = stats;
          this.context = context;
          // Answer asynchronously, like a real request
          setTimeout(() => callbacks.onSuccess({ url: context.url, data: text }, stats, context, null), 0);
        }
      };
    }

    function showNowPlaying(data) {
      nowPlaying.textContent = [data.track, data.artist].filter(Boolean).join(" · ") || "—";
    }

    function updateNowPlaying() {
      if (!station) return;
      // With hls.js, name the segment actually being heard; otherwise go by the clock
      showNowPlaying(heardSegment != null ? station.nowPlayingAtSegment(heardSegment) : station.nowPlaying(now()));
    }

    async function pollWorkerNowPlaying() {
      try { showNowPlaying(await (await fetch(`${WORKER_URL}/now-playing`)).json()); } catch {}
    }

    function play(src, label, usePlaylistLoader) {
      if (Hls.isSupported()) {
        const hls = new Hls({ lowLatencyMode: false, ...(usePlaylistLoader && { pLoader: stationLoader() }) });
        hls.loadSource(src);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          tuneIn();
          status.textContent = label;
        });
        // If something did pause it (a phone call, say), rejoin the live broadcast
        audio.addEventListener("play", () => {
          const live = hls.liveSyncPosition;
          if (live != null && live - audio.currentTime > 15) audio.currentTime = live;
        });
        // The media sequence number is the segment index since epoch
        hls.on(Hls.Events.FRAG_CHANGED, (_, { frag }) => { heardSegment = frag.sn; updateNowPlaying(); });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) status.textContent = `error: ${data.details}`;
        });
      } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        // Native HLS (Safari / older iOS) fetches playlists itself, so it needs the Worker
        audio.src = `${WORKER_URL}/stream.m3u8`;
        tuneIn();
        status.textContent = "native hls";
      } else {
        status.textContent = "HLS not supported in this browser";
      }
    }

    try {
      await Promise.all([loadStation(), syncClock()]);
      play(`${STATION_URL}/stream.m3u8`, "hls.js · local playlist", true);
      updateNowPlaying();
      setInterval(updateNowPlaying, 5000);
      setInterval(() => loadStation().catch(() => {}), REFRESH_MS);
    } catch (err) {
      // No station.json: let the Worker do the work, as before
      console.warn("Falling back to the Worker:", err);
      play(`${WORKER_URL}/stream.m3u8`, "hls.js · worker playlist", false);
      pollWorkerNowPlaying();
      setInterval(pollWorkerNowPlaying, 10000);
    }
  </script>
</body>
</html>
