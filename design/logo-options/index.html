<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>EdgeFM logo options</title>
<style>
  body { margin: 0; padding: 20px; background: #e9e8e4; font: 13px system-ui; display: grid; gap: 24px; }
  .opt { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; }
  .opt img.logo { width: 360px; box-shadow: 0 1px 4px rgb(0 0 0 / .2); }
  h2 { margin: 0 0 8px; font-size: 14px; }
</style></head>
<body>
  <section><h2>Option A — striped outline</h2>
    <div class="opt"><img class="logo" src="a-stripes.svg"><img src="a-icon.svg" width="64"><img src="a-icon.svg" width="32"><img src="a-icon.svg" width="16"></div></section>
  <section><h2>Option B — italic red &amp; yellow</h2>
    <div class="opt"><img class="logo" src="b-energy.svg"><img src="b-icon.svg" width="64"><img src="b-icon.svg" width="32"><img src="b-icon.svg" width="16"></div></section>
</body></html>
